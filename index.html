<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnDev - AI PRD Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                slate: {
                    850: '#151f32',
                    900: '#0f172a',
                    950: '#090d16'
                }
            }
        }
    }
}
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }
.markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.75rem; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
.markdown-body h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
.markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.4rem; color: #e2e8f0; }
.markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; color: #cbd5e1; }
.markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; color: #cbd5e1; }
.markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; color: #cbd5e1; }
.markdown-body li { margin-bottom: 0.25rem; }
.markdown-body strong { color: #f1f5f9; font-weight: 600; }
.markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
.markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; color: #cbd5e1; }
.markdown-body th { background-color: #1e293b; color: #f8fafc; }
.markdown-body code { background-color: #1e293b; color: #38bdf8; padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; }
.markdown-body pre code { background-color: transparent; padding: 0; color: inherit; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2 rounded-xl shadow-inner flex items-center justify-center text-white">
            <i class="fa-solid fa-file-lines text-xl"></i>
        </div>
        <div>
            <div class="flex items-center space-x-2">
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">LearnDev PRD</h1>
                <span class="text-[10px] font-semibold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-full uppercase tracking-wider">PWA</span>
            </div>
            <p class="text-xs text-slate-400 hidden sm:block">AI Project Requirements Document Generator</p>
        </div>
    </div>
    <div class="flex items-center space-x-2">
        <button id="btn-history" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3.5 py-2 rounded-lg transition shadow-sm">
            <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i>
            <span class="hidden sm:inline">Riwayat</span>
        </button>
        <button id="install-btn" class="hidden items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-2 rounded-lg transition shadow-sm">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span class="hidden md:inline">Install App</span>
        </button>
        <button id="apikey-btn" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3.5 py-2 rounded-lg transition shadow-sm">
            <i data-lucide="key" class="w-4 h-4 text-amber-400"></i>
            <span>API Key</span>
        </button>
        <button id="btn-settings" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg transition shadow-sm" title="Pengaturan 9Router & Endpoint">
            <i data-lucide="settings2" class="w-4 h-4 text-emerald-400"></i>
            <span>9Router</span>
        </button>
    </div>
</header>
<main class="flex-1 grid grid-cols-1 lg:grid-cols-12 h-[calc(100vh-61px)] overflow-hidden">
    <section class="lg:col-span-5 xl:col-span-4 bg-slate-900/50 border-r border-slate-800 flex flex-col h-full overflow-y-auto p-4 space-y-4">
        <div class="space-y-1">
            <label for="provider-select" class="block text-xs font-medium text-slate-300 uppercase tracking-wider">AI Provider</label>
            <div class="relative">
                <select id="provider-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition appearance-none pr-8">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Rekomendasi / Cepat)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fallback / Stabil)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Komprehensif)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
        </div>
         <div class="flex-1 flex flex-col space-y-1">
            <div class="flex justify-between items-center">
                <label for="prompt-input" class="block text-xs font-medium text-slate-300 uppercase tracking-wider">Prompt/Ide Aplikasi (PRD Generator)</label>
                <span class="text-[11px] text-slate-500">Structured .md PRD</span>
            </div>
            <textarea id="prompt-input" class="w-full flex-1 min-h-[140px] bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition resize-none placeholder-slate-500" placeholder="Contoh: Buatkan PRD untuk aplikasi e-commerce fashion lokal dengan fitur keranjang, checkout WhatsApp, dan sistem manajemen diskon flash sale."></textarea>
        </div>
        <div class="space-y-1">
            <label for="uiTheme" class="block text-xs font-medium text-slate-300 uppercase tracking-wider">TEMA / GAYA VISUAL UI (OPSIONAL)</label>
            <div class="relative">
                <select id="uiTheme" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition appearance-none pr-8">
                    <option value="auto" selected>Auto Detect from Prompt (Rekomendasi AI)</option>
                    <option value="modern-dark">Modern Dark Mode (SaaS Style)</option>
                    <option value="clean-min">Clean &amp; Minimalist White</option>
                    <option value="neon-cyberpunk">Neon Cyberpunk / Dark Futuristic</option>
                    <option value="soft-pastel">Soft Pastel / Friendly UI</option>
                    <option value="custom">Custom Vibe (Input Teks Bebas)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>
            <input type="text" id="uiThemeCustom" class="hidden w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition resize-none placeholder-slate-500 mt-1" placeholder="Deskripsikan tema UI yang diinginkan...">
        </div>
        <div class="bg-slate-800/40 border border-slate-700/60 rounded-lg p-3 space-y-2.5">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-1.5 text-slate-200 text-xs font-semibold">
                    <i data-lucide="sliders" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span>Token Saver & Optimization</span>
                </div>
                <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded">Smart</span>
            </div>
            <div class="space-y-2 pt-1 text-xs">
                <div class="flex items-center justify-between group">
                    <label for="toggle-compress" class="flex items-center space-x-1.5 cursor-pointer flex-1">
                        <span class="text-slate-300 group-hover:text-slate-100 transition">Compress Prompt & Context <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1 rounded ml-1">Rec: ON</span></span>
                    </label>
                    <button type="button" onclick="Swal.fire({title: 'Compress Prompt & Context', text: 'Memangkas spasi ganda dan baris kosong tak terpakai pada prompt sebelum dikirim ke AI. Menghemat hingga 30-50% kuota input token gratisan Anda.', background: '#0f172a', color: '#f8fafc', confirmButtonColor: '#4f46e5'})" class="text-slate-400 hover:text-indigo-400 mr-2 transition">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                    </button>
                    <input type="checkbox" id="toggle-compress" class="sr-only peer" checked>
                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative cursor-pointer" onclick="document.getElementById('toggle-compress').click()"></div>
                </div>
                <div class="flex items-center justify-between group">
                    <label for="toggle-concise" class="flex items-center space-x-1.5 cursor-pointer flex-1">
                        <span class="text-slate-300 group-hover:text-slate-100 transition">Concise Code / Terse-style <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1 rounded ml-1">Rec: ON</span></span>
                    </label>
                    <button type="button" onclick="Swal.fire({title: 'Concise Code / Terse-style', text: 'Instruksi ketat agar AI langsung mengembalikan PRD murni tanpa kata pengantar atau basa-basi. Mempercepat proses pembuatan dokumen.', background: '#0f172a', color: '#f8fafc', confirmButtonColor: '#4f46e5'})" class="text-slate-400 hover:text-indigo-400 mr-2 transition">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                    </button>
                    <input type="checkbox" id="toggle-concise" class="sr-only peer" checked>
                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative cursor-pointer" onclick="document.getElementById('toggle-concise').click()"></div>
                </div>
                <div class="flex items-center justify-between group">
                    <label for="toggle-minimalist" class="flex items-center space-x-1.5 cursor-pointer flex-1">
                        <span class="text-slate-300 group-hover:text-slate-100 transition">Minimalist Specs / YAGNI <span class="text-[10px] text-slate-400 bg-slate-700 px-1 rounded ml-1">Opt: OFF</span></span>
                    </label>
                    <button type="button" onclick="Swal.fire({title: 'Minimalist Specs / YAGNI', text: 'Mengarahkan AI untuk mengutamakan spesifikasi MVP esensial tanpa over-engineering yang tidak diperlukan.', background: '#0f172a', color: '#f8fafc', confirmButtonColor: '#4f46e5'})" class="text-slate-400 hover:text-indigo-400 mr-2 transition">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                    </button>
                    <input type="checkbox" id="toggle-minimalist" class="sr-only peer">
                    <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative cursor-pointer" onclick="document.getElementById('toggle-minimalist').click()"></div>
                </div>
            </div>
        </div>
        <button id="generate-btn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 px-4 rounded-lg shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2 transition active:scale-[0.99]">
            <i data-lucide="wand-2" class="w-5 h-5"></i>
            <span id="generate-text">Generate PRD Document</span>
            <svg id="generate-spinner" class="animate-spin -ml-1 mr-3 h-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </section>
    <section class="lg:col-span-7 xl:col-span-8 bg-slate-950 flex flex-col h-full overflow-hidden">
        <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between">
            <div class="flex items-center space-x-1 bg-slate-800 p-1 rounded-lg border border-slate-700/50">
                <button id="tab-preview" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium bg-indigo-600 text-white shadow-sm transition">
                    <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
                    <span>PRD Preview</span>
                </button>
                <button id="tab-code" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="file-code" class="w-3.5 h-3.5"></i>
                    <span>Raw Markdown</span>
                </button>
            </div>
            <div class="flex items-center space-x-2">
                <button id="copy-btn" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    <span>Salin PRD</span>
                </button>
                <button id="btnDownloadPdf" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Unduh PDF</span>
                </button>
                <button id="btnDownloadAgents" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Download AGENTS.md</span>
                </button>
            </div>
        </div>
        <div class="flex-1 relative overflow-hidden bg-slate-950">
            <div id="preview-container" class="absolute inset-0 w-full h-full bg-slate-950 overflow-auto p-6 markdown-body">
                <div id="prd-content" class="max-w-4xl mx-auto space-y-4"></div>
                <div id="preview-empty" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-center p-6 space-y-3">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-slate-500 shadow-inner">
                        <i class="fa-solid fa-file-text text-4xl"></i>
                    </div>
                    <div class="max-w-xs space-y-1">
                        <h3 class="text-sm font-semibold text-slate-300">Belum ada PRD yang dibuat</h3>
                        <p class="text-xs text-slate-500">Pilih provider, masukkan ide aplikasi, lalu klik "Generate PRD Document".</p>
                    </div>
                </div>
            </div>
            <div id="code-container" class="absolute inset-0 w-full h-full bg-[#2d2d2d] overflow-auto hidden">
                <pre class="language-markdown m-0 h-full p-4"><code id="code-output" class="language-markdown"></code></pre>
            </div>
        </div>
    </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
